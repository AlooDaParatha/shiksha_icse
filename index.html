<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Whiteboard Login</title>
  <style>
    body { margin:0; font-family:sans-serif; background:#f4f4f4; display:flex; justify-content:center; align-items:center; height:100vh; }
    #loginContainer { background:#fff; padding:20px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.2); text-align:center; }
    input { width:200px; padding:10px; margin:8px 0; border:1px solid #ddd; border-radius:4px; }
    button { padding:10px 20px; background:#4CAF50; color:white; border:none; border-radius:4px; cursor:pointer; }
    button:hover { background:#45a049; }
    #error { color:red; font-size:14px; }
  </style>
</head>
<body>

<div id="loginContainer">
  <h2>Login</h2>
  <input type="text" id="username" placeholder="Username">
  <br>
  <input type="password" id="password" placeholder="Password">
  <br>
  <button id="loginBtn">Login</button>
  <p id="error"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script>
let usersData = [];

async function loadUsers() {
  const response = await fetch('users.yaml');
  const yamlText = await response.text();
  const data = jsyaml.load(yamlText);
  usersData = data.users;
}

loadUsers();

document.getElementById('loginBtn').addEventListener('click', () => {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const error = document.getElementById('error');

  const user = usersData.find(u => u.username === username && u.password === password);
  if (user) {
    localStorage.setItem('loggedInUser', username);
    window.location.href = "whiteboard.html"; // Redirect to your whiteboard page
  } else {
    error.textContent = "Invalid username or password!";
  }
});
</script>

</body>
</html>
